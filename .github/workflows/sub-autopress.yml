name: SUB Autopress

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sub-autopress
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sub-autopress
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SUB_MODEL: claude-opus-5
      SUB_MAX_AGE_DAYS: "7"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: sub-autopress/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run SUB Autopress
        run: python app.py

      - name: Commit seen state
        run: |
          if [ -n "$(git status --porcelain state/seen.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state/seen.json
            git commit -m "SUB Autopress: update seen state"
            git pull --rebase --autostash
            git push
          else
            echo "No new story this run - nothing to commit."
          fi
